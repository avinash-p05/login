<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sumeet &amp; Priya - Wedding Invitation</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <meta name="description" content="Sumeet &amp; Priya joyfully invite you to their wedding on 02 December 2026 at Tara Bhavan Mangal Karyalay, Belagavi." />
  <meta property="og:title" content="Sumeet &amp; Priya - Wedding Invitation" />
  <meta property="og:description" content="02 December 2026 · Belagavi, Karnataka. Tap to open your invitation." />
  <meta property="og:image" content="images/og-preview.jpg" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#1d0b22" />
  <link rel="preload" as="image" href="images/cover.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Mukta:wght@400;600;700&family=Yatra+One&family=Tiro+Devanagari+Marathi:ital@0;1&family=Tiro+Devanagari+Hindi:ital@0;1&family=Noto+Serif+Kannada:wght@400;600;700&family=Baloo+Tamma+2:wght@500;700&display=swap" />
  <style>
    /* Layout: one centred column of "chapters"; each chapter is a full-bleed band
       (aubergine night or cream paper) separated by a Paithani border. */
    :root {
      --night: #1d0b22;
      --paithani: #3b1442;
      --magenta: #b0175b;
      --parrot: #2f7d4f;
      --zari: #d9a93f;
      --zari-light: #f3dc9b;
      --kumkum: #b3121f;
      --haldi: #f2c230;
      --paper: #fbf3e4;
      --paper-2: #f4e6cc;
      --ink: #2a1626;
      --muted: #6d5566;
      --line: rgba(217, 169, 63, 0.45);

      --fd: "Cormorant Garamond", Georgia, serif;
      --fb: "Cormorant Garamond", Georgia, serif;
      --fu: "Mukta", system-ui, sans-serif;
      --names: "Cormorant Garamond", Georgia, serif;
      --body-size: 19px;
      --track: 0.18em;
      color-scheme: dark;
    }
    html:lang(mr) { --fd: "Yatra One", "Tiro Devanagari Marathi", serif; --fb: "Tiro Devanagari Marathi", "Mukta", serif; --names: "Yatra One", serif; --body-size: 18px; --track: 0; }
    html:lang(hi) { --fd: "Yatra One", "Tiro Devanagari Hindi", serif; --fb: "Tiro Devanagari Hindi", "Mukta", serif; --names: "Yatra One", serif; --body-size: 18px; --track: 0; }
    html:lang(kn) { --fd: "Baloo Tamma 2", "Noto Serif Kannada", serif; --fb: "Noto Serif Kannada", serif; --fu: "Baloo Tamma 2", "Noto Serif Kannada", sans-serif; --names: "Baloo Tamma 2", serif; --body-size: 17px; --track: 0; }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--night);
      color: var(--ink);
      font-family: var(--fb);
      font-size: var(--body-size);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    body.locked { overflow: hidden; height: 100vh; }
    img { max-width: 100%; display: block; }
    button, input, textarea { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--zari); outline-offset: 3px; }

    /* ---------- shared pieces ---------- */
    .band { position: relative; padding-block: 64px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
    .band.dark { background: var(--night); color: var(--paper); }
    .band.paper { background: var(--paper); color: var(--ink); }
    .band.paper::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
      background: radial-gradient(rgba(176, 23, 91, 0.06) 1.2px, transparent 1.6px) 0 0 / 22px 22px;
    }
    .wrap { position: relative; max-width: 560px; margin: 0 auto; }
    .center { text-align: center; }

    .eyebrow {
      font-family: var(--fu); font-size: 13px; font-weight: 600;
      letter-spacing: var(--track); text-transform: uppercase; color: var(--magenta);
    }
    .dark .eyebrow { color: var(--zari); }
    .title {
      font-family: var(--fd); font-weight: 600; font-size: clamp(32px, 8.5vw, 44px);
      line-height: 1.15; margin-top: 6px; color: var(--paithani); text-wrap: balance;
    }
    .dark .title { color: var(--zari-light); }
    .ornament { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 14px auto 26px; color: var(--zari); }
    .ornament::before, .ornament::after { content: ""; width: 54px; height: 1px; background: linear-gradient(90deg, transparent, var(--zari)); }
    .ornament::after { transform: scaleX(-1); }
    .ornament svg { width: 22px; height: 22px; }
    .lead { max-width: 34ch; margin: 0 auto; color: var(--muted); text-wrap: pretty; }
    .dark .lead { color: rgba(251, 243, 228, 0.78); }

    /* Paithani border ("padar") between chapters */
    .padar {
      height: 28px; position: relative; z-index: 2;
      background:
        linear-gradient(var(--zari), var(--zari)) 0 3px / 100% 2px no-repeat,
        linear-gradient(var(--zari), var(--zari)) 0 23px / 100% 2px no-repeat,
        conic-gradient(from 135deg at 50% 0, var(--zari-light) 0 90deg, transparent 0) 0 6px / 16px 8px repeat-x,
        conic-gradient(from -45deg at 50% 100%, var(--zari) 0 90deg, transparent 0) 8px 14px / 16px 8px repeat-x,
        linear-gradient(180deg, var(--magenta) 0 50%, var(--parrot) 50% 100%);
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-family: var(--fu); font-weight: 600; font-size: 15px; letter-spacing: .02em;
      padding: 11px 18px; border-radius: 999px; cursor: pointer; text-decoration: none;
      border: 1.5px solid var(--zari); background: transparent; color: var(--paithani);
      transition: transform .15s ease, background .2s ease;
    }
    .btn:active { transform: scale(.97); }
    .btn svg { width: 17px; height: 17px; flex: none; }
    .btn.solid {
      background: linear-gradient(135deg, #f0c766 0%, var(--zari) 55%, #b5842a 100%);
      color: #2b0f12; border-color: #fff0c4; box-shadow: 0 8px 22px rgba(0, 0, 0, .25);
    }
    .demo-tag {
      position: absolute; top: 10px; left: 10px; z-index: 2;
      font-family: var(--fu); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      background: rgba(29, 11, 34, .78); color: var(--zari-light); padding: 3px 9px; border-radius: 999px;
    }

    /* scroll progress — a thread of zari */
    #progress {
      position: fixed; top: 0; left: 0; right: 0; height: calc(3px + env(safe-area-inset-top, 0px)); z-index: 9000;
      background: linear-gradient(90deg, var(--magenta), var(--zari), var(--zari-light));
      transform-origin: 0 50%; transform: scaleX(0); pointer-events: none;
      border-top: env(safe-area-inset-top, 0px) solid var(--night);
    }

    /* ================= COVER: THE ANTARPAT ================= */
    #cover {
      position: fixed; inset: 0; z-index: 9500; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center;
      padding: calc(22px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
      background: var(--night); color: var(--paper);
      transition: opacity 1s ease, visibility 1s ease;
    }
    #cover.gone { opacity: 0; visibility: hidden; pointer-events: none; }
    .cover-art { position: absolute; inset: 0; }
    .cover-art img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.06); filter: saturate(1.05) brightness(.62); transition: transform 2.6s cubic-bezier(.2,.7,.2,1), filter 2s ease; }
    #cover.open .cover-art img { transform: scale(1); filter: saturate(1.15) brightness(.5); }
    .cover-art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(29,11,34,.85) 0%, rgba(29,11,34,.15) 40%, rgba(29,11,34,.2) 60%, rgba(29,11,34,.92) 100%); }
    .cover-top, .cover-stage, .cover-bottom { position: relative; z-index: 2; width: 100%; max-width: 440px; }

    .lang-switch { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .lang-switch button {
      font-family: var(--fu); font-size: 14px; cursor: pointer; border-radius: 999px; padding: 5px 13px;
      background: rgba(29, 11, 34, .55); color: var(--zari-light); border: 1px solid rgba(243, 220, 155, .45);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }
    .lang-switch button[aria-pressed="true"] { background: var(--zari); color: #2b0f12; border-color: #fff0c4; font-weight: 700; }
    .cover-blessing { font-family: var(--fd); color: var(--zari-light); font-size: 17px; text-shadow: 0 2px 8px rgba(0,0,0,.8); }
    .cover-kicker { font-family: var(--fu); font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--zari); margin-top: 6px; }
    html:not(:lang(en)) .cover-kicker { font-size: 15px; letter-spacing: 0; }

    .cover-stage { flex: 1; display: grid; place-items: center; min-height: 0; perspective: 900px; }
    .cover-names { grid-area: 1 / 1; opacity: 0; transform: scale(.9); transition: opacity 1.1s .5s ease, transform 1.4s .5s cubic-bezier(.2,.7,.2,1); }
    #cover.open .cover-names { opacity: 1; transform: scale(1); }
    .cover-names h1 {
      font-family: var(--names); font-style: italic; font-weight: 600; line-height: 1; font-size: clamp(54px, 16vw, 86px);
      background: linear-gradient(180deg, #fff6d8 0%, var(--zari-light) 45%, var(--zari) 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,.7));
    }
    html:not(:lang(en)) .cover-names h1 { font-style: normal; line-height: 1.25; }
    .cover-names .amp { display: block; font-size: .5em; color: var(--zari); -webkit-text-fill-color: var(--zari); margin: 2px 0; }
    .cover-names p { font-family: var(--fu); letter-spacing: var(--track); text-transform: uppercase; font-size: 14px; color: var(--zari-light); margin-top: 14px; }

    .antarpat {
      grid-area: 1 / 1; position: relative; width: min(74vw, 300px); height: min(48vh, 360px);
      transform-origin: 50% 0; animation: clothSway 5s ease-in-out infinite;
      transition: transform 1.25s cubic-bezier(.55,0,.75,.2), opacity 1.25s ease;
    }
    .antarpat .cloth {
      position: absolute; inset: 14px 0 0; border-radius: 2px 2px 8px 8px;
      background:
        linear-gradient(90deg, rgba(0,0,0,.08), transparent 18%, transparent 82%, rgba(0,0,0,.1)),
        repeating-linear-gradient(90deg, rgba(255,255,255,0) 0 22px, rgba(160,120,90,.07) 22px 24px),
        #fff8ea;
      border: 10px solid var(--kumkum);
      box-shadow: inset 0 0 0 3px var(--zari), inset 0 0 0 7px #fff8ea, inset 0 0 0 8px var(--zari), 0 24px 50px rgba(0,0,0,.55);
      display: grid; place-items: center;
    }
    .antarpat .cloth::after {
      content: ""; position: absolute; left: -10px; right: -10px; bottom: -16px; height: 16px;
      background: repeating-linear-gradient(90deg, var(--zari) 0 3px, transparent 3px 7px);
      -webkit-mask: linear-gradient(#000, transparent); mask: linear-gradient(#000, transparent);
    }
    .antarpat .rod { position: absolute; top: 0; left: -14px; right: -14px; height: 16px; border-radius: 8px; background: linear-gradient(180deg, #f6dc8f, #a87a24); box-shadow: 0 4px 10px rgba(0,0,0,.4); }
    .antarpat .rod::before, .antarpat .rod::after { content: ""; position: absolute; top: -3px; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff2c2, var(--zari) 55%, #8c6118); }
    .antarpat .rod::before { left: -8px; } .antarpat .rod::after { right: -8px; }
    .antarpat svg { width: 58%; height: auto; }
    .antarpat .hint { position: absolute; bottom: 18px; left: 0; right: 0; font-family: var(--fd); color: var(--kumkum); font-size: 18px; }
    #cover.open .antarpat { transform: translateY(115vh) rotateX(14deg) rotate(-4deg); opacity: .2; animation: none; }
    @keyframes clothSway { 0%, 100% { transform: rotate(-.6deg) skewX(.4deg); } 50% { transform: rotate(.6deg) skewX(-.4deg); } }

    .open-btn {
      font-family: var(--fu); font-weight: 700; font-size: 16px; letter-spacing: .12em; text-transform: uppercase;
      padding: 15px 34px; border-radius: 999px; cursor: pointer;
      background: linear-gradient(135deg, #f0c766 0%, var(--zari) 55%, #b5842a 100%); color: #2b0f12; border: 2px solid #fff0c4;
      animation: pulseGlow 2.2s infinite;
    }
    html:not(:lang(en)) .open-btn { letter-spacing: 0; font-size: 17px; }
    .sound-hint { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 12px; font-family: var(--fu); font-size: 13px; color: rgba(251,243,228,.75); }
    .sound-hint svg { width: 16px; height: 16px; }
    #cover.open .cover-bottom, #cover.open .cover-top { opacity: 0; transform: translateY(16px); transition: opacity .6s ease, transform .6s ease; }
    @keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(240, 199, 102, .6); } 70% { box-shadow: 0 0 0 18px rgba(240, 199, 102, 0); } 100% { box-shadow: 0 0 0 0 rgba(240, 199, 102, 0); } }

    /* ================= HERO ================= */
    .hero {
      position: relative; overflow: hidden; text-align: center; color: var(--paper);
      padding: calc(96px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) 56px max(18px, env(safe-area-inset-left, 0px));
      background:
        radial-gradient(ellipse at 50% -10%, rgba(176, 23, 91, .45), transparent 60%),
        radial-gradient(ellipse at 50% 120%, rgba(47, 125, 79, .35), transparent 55%),
        radial-gradient(rgba(217, 169, 63, .2) 1.4px, transparent 1.9px) 0 0 / 26px 26px,
        var(--night);
    }
    #toran { position: absolute; top: 0; left: 0; width: 100%; height: 86px; pointer-events: none; }
    #toran .swing { transform-box: fill-box; transform-origin: 50% 0; animation: swing 3.6s ease-in-out infinite; }
    @keyframes swing { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    .mandala { position: absolute; left: 50%; top: 52%; width: 640px; height: 640px; margin: -320px 0 0 -320px; opacity: .16; animation: spin 120s linear infinite; pointer-events: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hero .wrap { z-index: 1; }
    .hero .blessing { font-family: var(--fd); color: var(--zari-light); font-size: 18px; }
    .hero .eyebrow { margin-top: 18px; color: var(--zari); }
    .hero-names {
      font-family: var(--names); font-style: italic; font-weight: 600; line-height: .95;
      font-size: clamp(64px, 21vw, 128px); margin: 10px 0 4px;
      background: linear-gradient(100deg, var(--zari) 0%, #fff3cf 20%, var(--zari) 40%, var(--zari-light) 60%, var(--zari) 100%);
      background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: shimmer 6s ease-in-out infinite;
    }
    html:not(:lang(en)) .hero-names { font-style: normal; line-height: 1.2; font-size: clamp(56px, 17vw, 104px); }
    .hero-names .amp { display: block; font-size: .42em; line-height: 1.3; -webkit-text-fill-color: var(--magenta); color: var(--magenta); font-style: italic; }
    @keyframes shimmer { 0% { background-position: 100% 0; } 60%, 100% { background-position: 0 0; } }
    .hero-alt { font-family: "Yatra One", var(--fd); color: var(--zari); font-size: 20px; }
    .hero .lead { margin-top: 18px; color: rgba(251, 243, 228, .82); }
    .hero-meta { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 18px; margin-top: 22px; font-family: var(--fu); font-size: 15px; color: var(--zari-light); }
    .hero-meta span { display: inline-flex; align-items: center; gap: 6px; }
    .hero-meta svg { width: 16px; height: 16px; color: var(--zari); }

    .countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 400px; margin: 30px auto 0; }
    .cd { border: 1px solid var(--line); border-radius: 14px; padding: 12px 4px 8px; background: rgba(59, 20, 66, .55); }
    .cd b { display: block; font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: clamp(30px, 9vw, 42px); line-height: 1; color: #fff3cf; font-variant-numeric: tabular-nums; }
    .cd small { font-family: var(--fu); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--zari); }
    html:not(:lang(en)) .cd small { letter-spacing: 0; font-size: 13px; }
    .cd-label { font-family: var(--fu); font-size: 13px; letter-spacing: var(--track); text-transform: uppercase; color: rgba(251,243,228,.7); margin-top: 34px; }
    .married { font-family: var(--fd); font-size: 30px; color: var(--zari-light); margin-top: 24px; }
    .scroll-hint { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; margin-top: 34px; font-family: var(--fu); font-size: 12px; letter-spacing: .15em; text-transform: uppercase; color: rgba(251,243,228,.6); text-decoration: none; }
    .scroll-hint svg { width: 22px; height: 22px; animation: nudge 1.8s ease-in-out infinite; }
    @keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }

    /* ================= SAVE THE DATE ================= */
    .scratch-box {
      position: relative; width: 270px; height: 160px; margin: 0 auto; border-radius: 18px; overflow: hidden;
      background: #fff; border: 2px solid var(--zari); box-shadow: 0 14px 30px rgba(59, 20, 66, .18);
      display: grid; place-items: center; user-select: none; -webkit-user-select: none;
    }
    .scratch-date .d { font-family: "Cormorant Garamond", serif; font-size: 64px; font-weight: 700; color: var(--kumkum); line-height: .9; }
    .scratch-date .w { font-family: var(--fu); font-weight: 700; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--zari); }
    html:not(:lang(en)) .scratch-date .w { letter-spacing: 0; font-size: 15px; }
    .scratch-date .m { font-family: var(--fd); font-size: 22px; color: var(--paithani); }
    #scratch { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; transition: opacity .7s ease; }
    .link-btn { background: none; border: 0; color: var(--magenta); text-decoration: underline; font-family: var(--fu); font-size: 14px; cursor: pointer; margin-top: 12px; }
    .full-date { font-family: var(--fd); font-size: 22px; color: var(--paithani); margin-top: 14px; }

    .calendar { margin-top: 34px; background: #fffaf1; border: 1px solid var(--line); border-radius: 20px; padding: 20px 14px 18px; box-shadow: 0 10px 24px rgba(59, 20, 66, .08); }
    .calendar h3 { font-family: var(--fd); font-size: 24px; color: var(--paithani); margin-bottom: 12px; font-weight: 600; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; font-family: var(--fu); font-size: 14px; font-variant-numeric: tabular-nums; }
    .cal-grid .h { font-size: 12px; font-weight: 700; color: var(--muted); padding-bottom: 4px; }
    .cal-grid .c { aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; }
    .cal-grid .e1 { background: var(--haldi); color: #3a2a00; font-weight: 700; }
    .cal-grid .e2 { background: var(--kumkum); color: #fff; font-weight: 700; box-shadow: 0 0 0 3px #fffaf1, 0 0 0 5px var(--zari); animation: beat 1.6s ease-in-out infinite; }
    .cal-grid .e3 { background: var(--parrot); color: #fff; font-weight: 700; }
    @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.12); } 30% { transform: scale(1); } 45% { transform: scale(1.08); } }
    .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; margin-top: 14px; font-family: var(--fu); font-size: 14px; color: var(--muted); }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

    /* ================= EVENTS CAROUSEL ================= */
    .events { margin: 0 calc(-1 * max(18px, env(safe-area-inset-left, 0px))); }
    .track {
      display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
      padding: 6px max(18px, env(safe-area-inset-left, 0px)) 18px;
      scroll-padding: 0 max(18px, env(safe-area-inset-left, 0px));
    }
    .track::-webkit-scrollbar { display: none; }
    .ev {
      --accent: var(--magenta);
      flex: 0 0 min(84%, 400px); scroll-snap-align: center; min-width: 0;
      background: var(--paper); color: var(--ink); border-radius: 22px; overflow: hidden;
      border-top: 6px solid var(--accent); box-shadow: 0 18px 40px rgba(0, 0, 0, .35);
      display: flex; flex-direction: column;
    }
    .ev.haldi { --accent: var(--haldi); } .ev.wed { --accent: var(--kumkum); } .ev.pooja { --accent: var(--parrot); }
    .ev .art { aspect-ratio: 4 / 3.4; overflow: hidden; background: #faf3e6; }
    .ev .art img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
    .ev .body { padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .ev .day { font-family: var(--fu); font-size: 13px; font-weight: 700; letter-spacing: var(--track); text-transform: uppercase; color: var(--accent); filter: brightness(.8); }
    .ev h3 { font-family: var(--fd); font-weight: 600; font-size: 32px; line-height: 1.1; color: var(--paithani); }
    .ev .sub { font-style: italic; color: var(--muted); margin-top: -2px; }
    .ev .facts { display: grid; gap: 6px; margin-top: 8px; font-family: var(--fu); font-size: 15px; }
    .ev .facts div { display: flex; gap: 8px; align-items: flex-start; }
    .ev .facts svg { width: 17px; height: 17px; flex: none; margin-top: 3px; color: var(--accent); filter: brightness(.85); }
    .ev .dress { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; margin-top: 8px; padding: 4px 12px 4px 6px; border-radius: 999px; background: var(--paper-2); font-family: var(--fu); font-size: 13px; }
    .ev .dress i { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); }
    .ev .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 14px; }
    .ev .actions .btn { flex: 1 1 auto; font-size: 14px; padding: 9px 12px; }
    .dots { display: flex; justify-content: center; gap: 8px; }
    .dots button { width: 9px; height: 9px; border-radius: 50%; border: 0; background: rgba(243, 220, 155, .35); cursor: pointer; transition: width .3s ease, background .3s ease; padding: 0; }
    .dots button[aria-current="true"] { width: 26px; border-radius: 6px; background: var(--zari); }

    /* ================= STORY ================= */
    .story { position: relative; display: grid; gap: 40px; margin-top: 8px; padding-left: 34px; }
    .story::before { content: ""; position: absolute; left: 10px; top: 6px; bottom: 6px; width: 2px; background: rgba(217, 169, 63, .25); }
    .story .thread { position: absolute; left: 10px; top: 6px; width: 2px; height: calc(100% - 12px); background: linear-gradient(var(--magenta), var(--zari)); transform-origin: 0 0; transform: scaleY(0); }
    .chapter { position: relative; min-width: 0; }
    .chapter::before { content: ""; position: absolute; left: -31px; top: 4px; width: 16px; height: 16px; border-radius: 50%; background: var(--paper); border: 3px solid var(--zari); box-shadow: 0 0 0 4px var(--paper); }
    .chapter .ph { position: relative; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; border: 6px solid #fff; box-shadow: 0 12px 28px rgba(59, 20, 66, .18); transform: rotate(var(--tilt, -1.2deg)); }
    .chapter:nth-child(odd) .ph { --tilt: 1.2deg; }
    .chapter .ph img { width: 100%; height: 100%; object-fit: cover; }
    .chapter .no { font-family: var(--fu); font-size: 13px; font-weight: 700; letter-spacing: var(--track); text-transform: uppercase; color: var(--magenta); margin-top: 16px; }
    .chapter h3 { font-family: var(--fd); font-weight: 600; font-size: 28px; line-height: 1.2; color: var(--paithani); }
    .chapter p { color: var(--muted); margin-top: 4px; }
    .demo-note { display: inline-block; margin-top: 10px; font-family: var(--fu); font-size: 13px; color: var(--muted); background: var(--paper-2); padding: 4px 12px; border-radius: 999px; }

    /* ================= GALLERY STACK ================= */
    .stack { position: relative; width: min(78vw, 300px); height: calc(min(78vw, 300px) * 1.22); margin: 8px auto 20px; touch-action: pan-y; }
    .polaroid {
      position: absolute; inset: 0; background: #fffdf7; border-radius: 6px; padding: 12px 12px 54px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .45); cursor: grab; user-select: none; -webkit-user-select: none;
      transition: transform .5s cubic-bezier(.2,.7,.2,1), opacity .4s ease;
    }
    .polaroid img { width: 100%; height: 100%; object-fit: cover; border-radius: 2px; pointer-events: none; }
    .polaroid figcaption { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-family: var(--fd); font-size: 22px; color: var(--paithani); }
    .polaroid.empty .slot { width: 100%; height: 100%; border: 2px dashed rgba(176, 23, 91, .4); border-radius: 4px; display: grid; place-items: center; text-align: center; font-family: var(--fu); color: var(--magenta); padding: 16px; background: repeating-linear-gradient(45deg, #fff7ec 0 12px, #fbefdd 12px 24px); }
    .stack-ctrl { display: flex; justify-content: center; gap: 12px; }
    .stack-ctrl .btn { color: var(--zari-light); }

    /* ================= FAMILY ================= */
    .family { text-align: center; }
    .family .blessing { font-family: var(--fd); color: var(--magenta); font-size: 21px; }
    .family .parents { font-weight: 700; margin-top: 18px; }
    .family .person { font-family: var(--names); font-size: clamp(40px, 12vw, 56px); font-weight: 600; font-style: italic; color: var(--paithani); line-height: 1.15; margin: 6px 0; }
    html:not(:lang(en)) .family .person { font-style: normal; }
    .seal { width: 86px; height: 86px; margin: 18px auto; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #c41d2c, #7a0b14); color: #fff0c4; font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 26px; font-weight: 600; box-shadow: 0 0 0 4px var(--paper), 0 0 0 6px var(--zari), 0 10px 22px rgba(122, 11, 20, .35); }
    .family .with { font-style: italic; color: var(--muted); }

    /* ================= VENUES ================= */
    .venue { position: relative; background: #fffaf1; border: 1px solid var(--line); border-radius: 20px; padding: 22px 20px; margin-top: 16px; text-align: left; display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; box-shadow: 0 10px 24px rgba(59, 20, 66, .07); }
    .venue .pin { grid-row: span 4; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--paithani); color: var(--zari-light); }
    .venue .pin svg { width: 22px; height: 22px; }
    .venue .tag { font-family: var(--fu); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--magenta); }
    html:not(:lang(en)) .venue .tag { letter-spacing: 0; font-size: 13px; }
    .venue h3 { font-family: var(--fd); font-size: 24px; font-weight: 600; color: var(--paithani); line-height: 1.2; }
    .venue p { color: var(--muted); font-size: .92em; }
    .venue .btn { justify-self: start; margin-top: 10px; }

    /* ================= AKSHATA ================= */
    .akshata-band { background: radial-gradient(ellipse at 50% 30%, #4a1650 0%, var(--night) 70%); }
    .couple-frame { position: relative; width: 220px; height: 220px; margin: 6px auto 0; border-radius: 50%; padding: 8px; background: conic-gradient(var(--zari), var(--zari-light), var(--zari), #a87a24, var(--zari)); box-shadow: 0 0 60px rgba(217, 169, 63, .35); }
    .couple-frame img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: 50% 28%; border: 4px solid var(--night); }
    .kalash-btn { display: block; margin: 18px auto 0; background: none; border: 0; cursor: pointer; width: 112px; transition: transform .15s ease; }
    .kalash-btn:active { transform: scale(.92) rotate(-6deg); }
    .kalash-btn svg { width: 100%; height: auto; filter: drop-shadow(0 8px 16px rgba(0,0,0,.5)); }
    .ak-count { font-family: var(--fd); font-size: 22px; color: var(--zari-light); margin-top: 8px; min-height: 1.6em; }
    .ak-flash { font-family: var(--fd); font-size: 26px; color: var(--haldi); min-height: 1.4em; transition: opacity .4s ease; }

    /* ================= RSVP ================= */
    .rsvp { background: #fffaf1; border: 1px solid var(--line); border-radius: 22px; padding: 22px 18px; box-shadow: 0 14px 30px rgba(59, 20, 66, .1); display: grid; gap: 16px; text-align: left; }
    .field { display: grid; gap: 6px; }
    .field > label, .field > .lbl { font-family: var(--fu); font-weight: 600; font-size: 14px; color: var(--paithani); }
    .rsvp input[type="text"], .rsvp textarea { width: 100%; border: 1.5px solid rgba(59, 20, 66, .2); border-radius: 12px; padding: 11px 14px; background: #fff; font-family: var(--fb); font-size: 17px; color: var(--ink); }
    .rsvp textarea { min-height: 84px; resize: vertical; }
    .rsvp input:focus, .rsvp textarea:focus { outline: none; border-color: var(--zari); box-shadow: 0 0 0 3px rgba(217, 169, 63, .3); }
    .stepper { display: inline-flex; align-items: center; gap: 0; border: 1.5px solid rgba(59, 20, 66, .2); border-radius: 999px; overflow: hidden; background: #fff; justify-self: start; }
    .stepper button { width: 44px; height: 42px; border: 0; background: transparent; font-size: 22px; cursor: pointer; color: var(--paithani); }
    .stepper output { min-width: 40px; text-align: center; font-family: var(--fu); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips label { position: relative; cursor: pointer; }
    .chips input { position: absolute; opacity: 0; pointer-events: none; }
    .chips span { display: inline-block; padding: 7px 14px; border-radius: 999px; border: 1.5px solid rgba(59, 20, 66, .2); font-family: var(--fu); font-size: 14px; background: #fff; transition: background .2s ease, border-color .2s ease; }
    .chips input:checked + span { background: var(--paithani); color: var(--zari-light); border-color: var(--paithani); }
    .chips input:focus-visible + span { outline: 2px solid var(--zari); outline-offset: 2px; }
    .rsvp .error { color: var(--kumkum); font-family: var(--fu); font-size: 14px; }
    .rsvp .btn.solid { width: 100%; padding: 14px; font-size: 16px; }

    /* ================= FOOTER ================= */
    .foot { text-align: center; padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
    .diyas { display: flex; justify-content: center; gap: 46px; margin-bottom: 18px; }
    .diya { position: relative; width: 50px; height: 44px; }
    .diya .lamp { position: absolute; bottom: 0; left: 0; width: 50px; height: 20px; border-radius: 4px 4px 50px 50px / 4px 4px 20px 20px; background: linear-gradient(180deg, #e0a03a, #a8541c); box-shadow: inset 0 3px 0 rgba(255,230,170,.6); }
    .diya .flame { position: absolute; left: 50%; bottom: 17px; width: 13px; height: 24px; margin-left: -6.5px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; background: radial-gradient(ellipse at 50% 72%, #fffbe6 0%, #ffd55c 38%, #ff9a1f 72%, rgba(255,120,20,0) 100%); box-shadow: 0 0 22px 8px rgba(255, 190, 80, .45); transform-origin: 50% 100%; animation: flicker 1.6s ease-in-out infinite alternate; }
    .diya:nth-child(2) .flame { animation-delay: -.7s; }
    @keyframes flicker { 0% { transform: scale(1, 1) rotate(-2deg); } 40% { transform: scale(.92, 1.08) rotate(2deg); } 70% { transform: scale(1.04, .94) rotate(-1deg); } 100% { transform: scale(.97, 1.05) rotate(1.5deg); } }
    .foot .see { font-family: var(--fd); font-size: 34px; color: var(--zari-light); line-height: 1.2; }
    .foot .love { font-family: var(--fu); color: rgba(251,243,228,.8); margin-top: 6px; }
    .foot .closing { font-style: italic; color: rgba(251,243,228,.7); max-width: 32ch; margin: 18px auto 0; }
    .foot .btn { color: var(--zari-light); margin-top: 24px; }
    .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; z-index: 9800; background: var(--paper); color: var(--paithani); font-family: var(--fu); font-weight: 600; padding: 10px 18px; border-radius: 999px; box-shadow: 0 10px 30px rgba(0,0,0,.4); transition: opacity .3s ease, transform .3s ease; pointer-events: none; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ================= FLOATING CONTROLS ================= */
    .floating { position: fixed; z-index: 9400; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    .fab { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; background: radial-gradient(circle at 35% 30%, #5a1f63, var(--night)); border: 2px solid var(--zari); color: var(--zari-light); box-shadow: 0 8px 20px rgba(0,0,0,.4); font-family: "Yatra One", serif; font-size: 20px; }
    .fab svg { width: 22px; height: 22px; }
    .eq { display: flex; align-items: flex-end; gap: 3px; height: 18px; }
    .eq i { width: 3px; background: var(--zari-light); border-radius: 2px; animation: eq 1s ease-in-out infinite; }
    .eq i:nth-child(2) { animation-delay: -.33s; } .eq i:nth-child(3) { animation-delay: -.66s; }
    @keyframes eq { 0%, 100% { height: 5px; } 50% { height: 17px; } }
    .lang-menu { background: var(--paper); border: 1px solid var(--zari); border-radius: 16px; padding: 6px; display: grid; gap: 2px; box-shadow: 0 14px 34px rgba(0,0,0,.4); }
    .lang-menu button { background: transparent; border: 0; border-radius: 10px; padding: 8px 18px; text-align: left; cursor: pointer; color: var(--paithani); font-size: 16px; }
    .lang-menu button[aria-pressed="true"] { background: var(--paper-2); font-weight: 700; }

    #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9600; }

    /* reveal on scroll — visible at rest; only off-screen items wait */
    .rv { transition: opacity .9s ease, transform .9s cubic-bezier(.2,.7,.2,1); }
    .rv.wait { opacity: 0; transform: translateY(30px); }

    @media (min-width: 760px) {
      .band { padding-block: 88px; }
      .ev { flex-basis: 380px; }
      .track { justify-content: safe center; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      html { scroll-behavior: auto; }
      #fx { display: none; }
    }
  </style>
</head>

      notes.forEach(function (n, i) {
        const f = SA * R[n[0]], d = n[1] * B;
        if (i === 0) { o.frequency.setValueAtTime(f * .97, tt); o.frequency.setTargetAtTime(f, tt, .04); o2.frequency.setValueAtTime(f, tt); env.gain.linearRampToValueAtTime(A, tt + .08); }
        else { o.frequency.setTargetAtTime(f, tt - .03, .035); o2.frequency.setTargetAtTime(f, tt - .03, .035); env.gain.setTargetAtTime(A * .7, tt - .04, .015); env.gain.setTargetAtTime(A, tt + .02, .03); }
        vd.gain.setTargetAtTime(n[1] >= 1.5 ? f * .014 : f * .003, tt + .18, .12);
        tt += d;
      });
      env.gain.setTargetAtTime(0, tt - .12, .12);
      o.connect(hp); o2.connect(g2); g2.connect(hp); hp.connect(f1); f1.connect(f2); f2.connect(lp); lp.connect(env); env.connect(bus);
      [o, o2, vib].forEach(function (x) { x.start(t0); x.stop(tt + 1); });
    }
    function scheduler() {
      while (nextBar < ac.currentTime + 1.5) {
        const sec = SONG[bar % SONG.length];
        drumBar(nextBar, sec === "~");
        if (PH[sec]) shehnai(PH[sec], nextBar);
        nextBar += 8 * B; bar++;
      }
    }
    function fade(v, s) {
      if (el) { const from = el.volume, n = 20; let k = 0; const iv = setInterval(function () { k++; el.volume = Math.max(0, Math.min(1, from + (v - from) * k / n)); if (k >= n) clearInterval(iv); }, s * 1000 / n); return; }
      const now = ac.currentTime; master.gain.cancelScheduledValues(now); master.gain.setValueAtTime(master.gain.value, now); master.gain.linearRampToValueAtTime(v, now + s);
    }
    function start() {
      if (started) return; started = true;
      try {
        if (MUSIC_FILE) { el = new Audio(MUSIC_FILE); el.loop = true; el.volume = 0; el.play().catch(function () {}); fade(VOL, 3); }
        else { setup(); ac.resume(); nextBar = ac.currentTime + .15; scheduler(); setInterval(scheduler, 250); fade(VOL, 2.5); }
      } catch (e) { started = false; }
      refresh();
    }
    function toggle() {
      if (!started) { muted = false; start(); return; }
      muted = !muted;
      if (el) { if (muted) { fade(0, .4); setTimeout(function () { if (muted) el.pause(); }, 450); } else { el.play().catch(function () {}); fade(VOL, 1); } }
      else if (muted) { fade(0, .4); setTimeout(function () { if (muted) ac.suspend(); }, 450); }
      else { ac.resume().then(function () { fade(VOL, 1.2); }); }
      refresh();
    }
    function refresh() {
      const on = started && !muted, b = $("#music-btn");
      b.setAttribute("aria-pressed", String(on)); b.setAttribute("aria-label", t(on ? "muteMusic" : "playMusic"));
      $("#music-on").hidden = !on; $("#music-off").hidden = on;
    }
    document.addEventListener("visibilitychange", function () {
      if (!started || muted) return;
      if (document.hidden) { el ? el.pause() : ac.suspend(); } else { el ? el.play().catch(function () {}) : ac.resume(); }
    });
    return { start: start, toggle: toggle, refresh: refresh };
  })();
  $("#music-btn").addEventListener("click", Music.toggle);

  /* =======================================================================
     FX — petals and akshata (rice with turmeric & kumkum)
     ======================================================================= */
  const FX = (function () {
    const cv = $("#fx"), ctx = cv.getContext("2d");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const PETAL = ["#f4a020", "#f7b733", "#e8762b", "#e79aa6", "#d63d6a", "#f2c94c"];
    const GRAIN = ["#f6dd7a", "#fff1c2", "#f2c230", "#c8181f", "#e9b949", "#fff1c2"];
    let W = 0, H = 0, ps = [], ambient = 0, running = false, last = 0;
    function size() { const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
    function mk(type, x, y, vx, vy) {
      const grain = type === "grain";
      return { type: type, x: x, y: y, vx: vx, vy: vy, g: grain ? .16 : .02, drag: grain ? .985 : .97,
        r: grain ? 2.2 + Math.random() * 1.4 : 4 + Math.random() * 6, rot: Math.random() * 6.3, vr: (Math.random() - .5) * (grain ? .3 : .05),
        flip: Math.random() * 6.3, vf: .02 + Math.random() * .04, sway: grain ? 0 : .3 + Math.random() * .7, ph: Math.random() * 6.3,
        c: (grain ? GRAIN : PETAL)[(Math.random() * 6) | 0], amb: false };
    }
    function loop(ts) {
      if (!running) return;
      const dt = Math.min(3, (ts - last) / 16.7 || 1); last = ts;
      ctx.clearRect(0, 0, W, H);
      for (let i = ps.length - 1; i >= 0; i--) {
        const p = ps[i];
        p.vx *= Math.pow(p.drag, dt); p.vy = p.vy * Math.pow(p.drag, dt) + p.g * dt;
        if (p.type === "petal" && p.vy > .9) p.vy = .9;
        p.ph += .02 * dt; p.x += (p.vx + Math.sin(p.ph) * p.sway) * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.flip += p.vf * dt;
        if (p.y > H + 20 || p.x < -50 || p.x > W + 50) {
          if (p.amb) { Object.assign(p, mk("petal", Math.random() * W, -20, 0, .4 + Math.random() * .4)); p.amb = true; } else { ps.splice(i, 1); continue; }
        }
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        if (p.type === "grain") {
          ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * .42, 0, 0, 6.3); ctx.fill();
        } else {
          ctx.scale(1, Math.abs(Math.cos(p.flip)) * .75 + .25); ctx.globalAlpha = p.amb ? .7 : .9; ctx.fillStyle = p.c;
          ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * .55, 0, 0, 6.3); ctx.fill();
          ctx.globalAlpha = .35; ctx.fillStyle = "#fff4d6"; ctx.beginPath(); ctx.ellipse(-p.r * .3, -p.r * .12, p.r * .4, p.r * .16, 0, 0, 6.3); ctx.fill();
        }
        ctx.restore();
      }
      if (ps.length) requestAnimationFrame(loop); else running = false;
    }
    function run() { if (reduce) return; if (!W) size(); if (!running) { running = true; last = performance.now(); requestAnimationFrame(loop); } }
    function burst(x, y, n, type) {
      if (reduce) return;
      for (let i = 0; i < n; i++) { const a = Math.random() * 6.3, s = (type === "grain" ? 3 : 2) + Math.random() * 5; ps.push(mk(type || "petal", x, y, Math.cos(a) * s, Math.sin(a) * s - 3)); }
      run();
    }
    function rain(x0, x1, y, n, type) {
      if (reduce) return;
      for (let i = 0; i < n; i++) ps.push(mk(type, x0 + Math.random() * (x1 - x0), y - Math.random() * 120, (Math.random() - .5) * 1.5, 1 + Math.random() * 2));
      run();
    }
    function ambientOn(n) {
      if (reduce || ambient) return; ambient = n; size();
      for (let i = 0; i < n; i++) { const p = mk("petal", Math.random() * W, -20 - Math.random() * H, 0, .4 + Math.random() * .4); p.amb = true; ps.push(p); }
      run();
    }
    addEventListener("resize", function () { if (W) size(); });
    document.addEventListener("visibilitychange", function () { if (document.hidden) running = false; else if (ps.length) run(); });
    return { burst: burst, rain: rain, ambientOn: ambientOn };
  })();

  // a pinch of akshata wherever a guest taps
  document.addEventListener("click", function (e) {
    if (!opened || e.target.closest("button, a, input, textarea, label, .polaroid, #scratch, .floating")) return;
    FX.burst(e.clientX, e.clientY, 10, "grain");
  });

  /* =======================================================================
     HERO DECOR — toran (mango leaves & marigolds) and a slow mandala
     ======================================================================= */
  (function buildToran() {
    let s = '<path d="M0 6 Q200 26 400 6" stroke="#d9a93f" stroke-width="2" fill="none"/>';
    for (let i = 0; i < 21; i++) {
      const x = 10 + i * 19, y = 6 + 20 * (1 - Math.pow((x - 200) / 200, 2)) * .95;
      const d = (-i * .23).toFixed(2);
      if (i % 2 === 0) s += '<g class="swing" style="animation-delay:' + d + 's"><path d="M' + x + ' ' + y + ' q-7 18 0 36 q7 -18 0 -36z" fill="#2f7d4f"/><path d="M' + x + ' ' + (y + 2) + ' v32" stroke="#1e5a37" stroke-width=".8"/></g>';
      else s += '<g class="swing" style="animation-delay:' + d + 's"><circle cx="' + x + '" cy="' + (y + 9) + '" r="7" fill="#f39c1e"/><circle cx="' + x + '" cy="' + (y + 9) + '" r="4" fill="#e8762b"/><circle cx="' + x + '" cy="' + (y + 22) + '" r="5" fill="#f7b733"/></g>';
    }
    $("#toran").innerHTML = s;
  })();
  (function buildMandala() {
    let s = "";
    for (let ring = 0; ring < 3; ring++) {
      const n = [12, 18, 24][ring], r = [34, 58, 84][ring], len = [22, 26, 22][ring];
      for (let i = 0; i < n; i++) s += '<ellipse cx="0" cy="' + (-r) + '" rx="' + (len / 3.2) + '" ry="' + (len / 2) + '" transform="rotate(' + (360 / n * i) + ')" fill="none" stroke="#d9a93f" stroke-width=".8"/>';
    }
    s += '<circle r="20" fill="none" stroke="#d9a93f" stroke-width=".8"/><circle r="96" fill="none" stroke="#d9a93f" stroke-width=".6"/>';
    $("#mandala").innerHTML = s;
  })();

  /* =======================================================================
     COUNTDOWN
     ======================================================================= */
  const TARGET = new Date("2026-12-02T12:55:00+05:30").getTime();
  function tick() {
    const diff = TARGET - Date.now();
    if (diff <= 0) { $("#countdown").hidden = true; $("#married").hidden = false; return; }
    const p = function (n) { return String(n).padStart(2, "0"); };
    $("#cd-d").textContent = p(Math.floor(diff / 864e5)); $("#cd-h").textContent = p(Math.floor(diff / 36e5) % 24);
    $("#cd-m").textContent = p(Math.floor(diff / 6e4) % 60); $("#cd-s").textContent = p(Math.floor(diff / 1e3) % 60);
  }
  tick(); setInterval(tick, 1000);

  /* =======================================================================
     CALENDAR
     ======================================================================= */
  function renderCalendar() {
    let h = "";
    t("weekdays").forEach(function (d) { h += '<div class="h">' + d + '</div>'; });
    for (let i = 0; i < new Date(2026, 11, 1).getDay(); i++) h += "<div></div>";
    for (let d = 1; d <= 31; d++) h += '<div class="c' + (d === 1 ? " e1" : d === 2 ? " e2" : d === 3 ? " e3" : "") + '">' + d + '</div>';
    $("#cal").innerHTML = h;
  }

  /* =======================================================================
     SCRATCH CARD
     ======================================================================= */
  const Scratch = (function () {
    const cv = $("#scratch"), c = cv.getContext("2d");
    let down = false, done = false;
    const api = { touched: false };
    api.draw = function () {
      c.globalCompositeOperation = "source-over";
      const g = c.createLinearGradient(0, 0, cv.width, cv.height);
      g.addColorStop(0, "#c58b2a"); g.addColorStop(.5, "#f0cf78"); g.addColorStop(1, "#b07a22");
      c.fillStyle = g; c.fillRect(0, 0, cv.width, cv.height);
      c.globalAlpha = .18; c.fillStyle = "#fff";
      for (let x = -cv.height; x < cv.width; x += 14) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x + cv.height, cv.height); c.lineTo(x + cv.height + 5, cv.height); c.lineTo(x + 5, 0); c.fill(); }
      c.globalAlpha = 1; c.fillStyle = "#4a1a12"; c.textAlign = "center";
      c.font = "24px Georgia, serif"; c.fillText("♥  ♥  ♥", cv.width / 2, 70);
      c.font = "600 16px " + (lang === "kn" ? '"Baloo Tamma 2", sans-serif' : '"Mukta", sans-serif');
      c.fillText(t("scratchHere"), cv.width / 2, 104);
    };
    function pos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; }
    function scratch(e) { api.touched = true; const p = pos(e); c.globalCompositeOperation = "destination-out"; c.beginPath(); c.arc(p.x, p.y, 24, 0, 6.3); c.fill(); }
    function ratio() { const d = c.getImageData(0, 0, cv.width, cv.height).data; let k = 0, n = 0; for (let i = 3; i < d.length; i += 64) { n++; if (d[i] === 0) k++; } return k / n; }
    api.finish = function () {
      if (done) return; done = true; api.touched = true;
      cv.style.opacity = "0"; setTimeout(function () { cv.hidden = true; }, 700);
      $("#full-date").hidden = false; $("#scratch-skip").hidden = true;
      const r = cv.getBoundingClientRect(); FX.burst(r.left + r.width / 2, r.top + r.height / 2, 46, "petal"); FX.burst(r.left + r.width / 2, r.top + r.height / 2, 40, "grain");
    };
    function end() { if (!down) return; down = false; if (ratio() > .45) api.finish(); }
    cv.addEventListener("pointerdown", function (e) { down = true; cv.setPointerCapture(e.pointerId); scratch(e); });
    cv.addEventListener("pointermove", function (e) { if (down) scratch(e); });
    cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
    $("#scratch-skip").addEventListener("click", api.finish);
    return api;
  })();

  /* =======================================================================
     AKSHATA
     ======================================================================= */
  const Akshata = (function () {
    let n = 0;
    try { n = parseInt(localStorage.getItem("invite-akshata") || "0", 10) || 0; } catch (e) {}
    function render() { $("#ak-count").textContent = n ? t("akCount").replace("{n}", n) : ""; }
    $("#kalash").addEventListener("click", function () {
      n++; try { localStorage.setItem("invite-akshata", String(n)); } catch (e) {}
      const r = $("#couple-frame").getBoundingClientRect();
      FX.rain(r.left, r.right, r.top - 20, 46, "grain");
      if (n % 5 === 0) FX.rain(r.left - 30, r.right + 30, r.top - 20, 20, "petal");
      render();
      if (n === 1 || n % 11 === 0) {
        const f = $("#ak-flash"), w = t("akWow"); f.textContent = w[(n / 11 | 0) % w.length]; f.style.opacity = 1;
        clearTimeout(f._t); f._t = setTimeout(function () { f.style.opacity = 0; }, 2200);
      }
    });
    return { render: render };
  })();

  /* =======================================================================
     RSVP via WhatsApp
     ======================================================================= */
  const Rsvp = (function () {
    let guests = 2;
    const out = $("#r-guests");
    $("#r-minus").addEventListener("click", function () { guests = Math.max(1, guests - 1); out.textContent = guests; update(); });
    $("#r-plus").addEventListener("click", function () { guests = Math.min(20, guests + 1); out.textContent = guests; update(); });
    function update() {
      const name = $("#r-name").value.trim();
      const evs = Array.from(document.querySelectorAll("#r-events input:checked")).map(function (i) { return t(i.value); }).join(", ");
      const wish = $("#r-wish").value.trim();
      let msg = "🙏 " + t("rmHead") + "\n" + t("rmName") + ": " + name + "\n" + t("rmGuests") + ": " + guests + "\n" + t("rmEvents") + ": " + (evs || "-");
      if (wish) msg += "\n" + t("rmWish") + ": " + wish;
      $("#r-send").href = "https://wa.me/" + RSVP_WHATSAPP + "?text=" + encodeURIComponent(msg);
      if (name) $("#r-error").hidden = true;
    }
    ["#r-name", "#r-wish"].forEach(function (s) { $(s).addEventListener("input", update); });
    $("#r-events").addEventListener("change", update);
    $("#r-send").addEventListener("click", function (e) {
      if (!$("#r-name").value.trim()) { e.preventDefault(); $("#r-error").hidden = false; $("#r-name").focus(); return; }
      update();
      const r = this.getBoundingClientRect(); FX.burst(r.left + r.width / 2, r.top, 30, "petal");
    });
    $("#rsvp-form").addEventListener("submit", function (e) { e.preventDefault(); });
    return { update: update };
  })();

  /* =======================================================================
     COPY LINK + TOAST
     ======================================================================= */
  function toast(msg) { const el = $("#toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove("show"); }, 2400); }
  $("#copy-link").addEventListener("click", function () {
    const url = location.href.split("#")[0];
    try { navigator.clipboard.writeText(url).then(function () { toast(t("copied")); }, function () { toast(t("copyFail")); }); }
    catch (e) { toast(t("copyFail")); }
  });

  /* =======================================================================
     SCROLL: progress thread, story thread, reveal
     ======================================================================= */
  let io;
  function observeReveal() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) return;
    if (!io) io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.remove("wait"); io.unobserve(e.target); } }); }, { threshold: .12 });
    document.querySelectorAll(".rv:not(.seen)").forEach(function (el) {
      el.classList.add("seen");
      if (el.getBoundingClientRect().top > innerHeight) { el.classList.add("wait"); io.observe(el); }
    });
  }
  addEventListener("scroll", function () {
    requestAnimationFrame(function () {
      const h = document.documentElement.scrollHeight - innerHeight;
      $("#progress").style.transform = "scaleX(" + (h > 0 ? scrollY / h : 0) + ")";
      const r = $("#story-list").getBoundingClientRect();
      $("#thread").style.transform = "scaleY(" + Math.max(0, Math.min(1, (innerHeight * .7 - r.top) / r.height)) + ")";
    });
  }, { passive: true });

  /* =======================================================================
     LANGUAGE
     ======================================================================= */
  function pickInitialLang() {
    const q = (new URLSearchParams(location.search).get("lang") || location.hash.replace("#", "")).toLowerCase();
    if (LANGS.includes(q)) return q;
    try { const s = localStorage.getItem("invite-lang"); if (LANGS.includes(s)) return s; } catch (e) {}
    const nav = (navigator.language || "en").slice(0, 2).toLowerCase();
    return LANGS.includes(nav) ? nav : "en";
  }
  function applyLang(next) {
    lang = next;
    document.documentElement.lang = lang;
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach(function (el) { const v = t(el.dataset.i18n); if (typeof v === "string") el.innerHTML = v; });
    document.querySelectorAll("[data-i18n-aria]").forEach(function (el) { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
    document.querySelectorAll("[data-set-lang]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.setLang === lang)); });
    $("#lang-fab").setAttribute("aria-label", t("changeLang"));
    renderCalendar(); renderEvents(); renderStory(); renderGallery();
    if (!Scratch.touched) Scratch.draw();
    Akshata.render(); Rsvp.update(); Music.refresh();
    if (opened) observeReveal();
    try { localStorage.setItem("invite-lang", lang); } catch (e) {}
  }
  document.querySelectorAll("[data-set-lang]").forEach(function (b) { b.addEventListener("click", function () { applyLang(b.dataset.setLang); closeMenu(); }); });
  const langMenu = $("#lang-menu"), langFab = $("#lang-fab");
  function closeMenu() { langMenu.hidden = true; langFab.setAttribute("aria-expanded", "false"); }
  langFab.addEventListener("click", function (e) { e.stopPropagation(); const o = langMenu.hidden; langMenu.hidden = !o; langFab.setAttribute("aria-expanded", String(o)); });
  document.addEventListener("click", function (e) { if (!langMenu.hidden && !langMenu.contains(e.target)) closeMenu(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeMenu(); });

  /* =======================================================================
     COVER — lower the antarpat
     ======================================================================= */
  $("#open-btn").addEventListener("click", function () {
    const cover = $("#cover");
    if (cover.classList.contains("open")) return;
    cover.classList.add("open");
    Music.start();
    FX.rain(0, innerWidth, -10, Math.min(260, innerWidth * .6), "grain");
    setTimeout(function () { FX.rain(0, innerWidth, -10, 60, "petal"); }, 300);
    setTimeout(function () {
      cover.classList.add("gone");
      document.body.classList.remove("locked");
      $("#floating").hidden = false;
      opened = true;
      FX.ambientOn(Math.round(Math.min(12, Math.max(7, innerWidth / 40))));
      observeReveal();
    }, 3000);
  });

  /* ======================================================================= */
  applyLang(pickInitialLang());
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (!Scratch.touched) Scratch.draw(); });
  </script>
</body>
